# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Elena's Notes
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: zh-CN
  baseUrl: elenahui.github.io/Notes
  # 内容目录就是仓库根目录（构建时用 -d ..），所以这里的排除规则针对仓库顶层。
  # 以点开头的目录（.git/.obsidian/.quartz）已被 globby 的 dot:false 自动排除。
  ignorePatterns:
    # --- Quartz 自身与工具目录 ---
    - .quartz
    - .quartz/**
    - .obsidian
    - .obsidian/**
    # --- 不公开发布的笔记（黑名单）---
    - PTG
    - PTG/**
    - Opencode
    - Opencode/**
    - 论文
    - 论文/**
    - 待办汇总.md
    # 内部部署 runbook：含内网域名 *.eng.t-head.cn、同事用户名路径、钉钉内部文档链接
    # 该笔记在 监控链路搭建/ 子目录下，不带 **/ 前缀的模式只会匹配内容根目录
    - "**/模型部署.md"
    # 内部材料截图（Assets emitter 会复制所有非 md 文件，未被引用也会发布）
    - "**/*红区*"
    - "**/*PPU*"
    # --- 常规私有目录 ---
    - private
    - private/**
    - templates
    - templates/**
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      # 标题用暖调衬线（拉丁），正文用人文无衬线，中文回退在 custom.scss 里补齐
      header: Newsreader
      body: Source Sans 3
      code: IBM Plex Mono
    colors:
      # 「温暖纸质」配色：米白纸面 + 赭石强调色
      lightMode:
        light: "#fbf7f0"
        lightgray: "#e7ded0"
        gray: "#b7a894"
        darkgray: "#4b4238"
        dark: "#262019"
        secondary: "#a3552e"
        tertiary: "#c58a4f"
        highlight: rgba(178, 148, 106, 0.15)
        textHighlight: "#f6d78f88"
      darkMode:
        light: "#1a1815"
        lightgray: "#322d26"
        gray: "#6d6255"
        darkgray: "#ded5c6"
        dark: "#f4ede1"
        secondary: "#d99a63"
        tertiary: "#b9855a"
        highlight: rgba(200, 168, 120, 0.13)
        textHighlight: "#a8802288"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      # vitesse 系列的低饱和配色与纸质底色更协调
      theme:
        light: vitesse-light
        dark: vitesse-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      # 目录放右栏最上方，且只在真的有标题时出现
      priority: 10
      condition: has-toc
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: false
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: tokyo-night
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  # 仅在使用自定义域名时开启：否则会生成内容为 elenahui.github.io 的 CNAME 文件，
  # 让 GitHub Pages 误判为自定义域名，导致 /Notes 项目站点无法访问。
  - source: "@quartz-community/cname"
    enabled: false
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 30
      display: desktop-only
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
      # 没有反链的页面不再显示空卡片
      condition: has-backlinks
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: true
    layout:
      position: beforeBody
      priority: 30
      condition: has-tags
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        GitHub: https://github.com/ElenaHUI/Notes
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: true
    options:
      title: 最近更新
      limit: 5
      showTags: false
      hideTagPages: true
      hideFolderPages: true
    layout:
      position: right
      priority: 40
      display: desktop-only
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    # 这个插件同时负责解析 frontmatter，不能关掉；
    # 只隐藏它渲染的属性表格，标签改由 tag-list 以标签片展示
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
